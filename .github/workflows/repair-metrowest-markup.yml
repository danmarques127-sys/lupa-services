name: Repair MetroWest section markup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-metrowest-markup.yml'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Correct local card and section HTML
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          count=0
          for p in Path('service-areas').glob('*.html'):
              s=p.read_text(encoding='utf-8')
              before=s
              # The previous split must not leave an empty panel or an orphan closing div.
              s=re.sub(r'<div class="panel"></div></section><section class="lupaContentSection"><div class="container">(<h2>Planning a Project[^<]*</h2><p>[\s\S]*?</p>)</div>\s*</div></section>',r'</div></section><section class="lupaContentSection"><div class="container"><div class="panel">\1</div></div></section>',s,count=1)
              if s!=before:
                  p.write_text(s,encoding='utf-8')
                  count+=1
          print('Repaired',count,'pages')
          PY
      - name: Commit corrected markup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add service-areas
          if ! git diff --cached --quiet; then
            git commit -m 'fix: repair local project cards and section nesting'
            git push
          fi
